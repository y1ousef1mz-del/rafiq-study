name: Build Rafiq Study APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'rafiq_android_project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -q rafiq_android_project.zip -d .
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fix Java compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rafiq_android_project/app/build.gradle.kts')
          s = p.read_text()
          assert 'android {' in s, 'Android configuration not found'
          s = s.replace('android {', '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }''', 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: rafiq_android_project
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rafiq-study-debug-apk
          path: rafiq_android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
